name: avukatbul
description: Avukat bulma ve danışmanlık uygulaması.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.15.0
  firebase_auth: ^4.7.2
  cloud_firestore: ^4.8.4
  firebase_storage: ^11.2.5
  firebase_messaging: ^14.6.5
  
  # UI
  cupertino_icons: ^1.0.5
  flutter_local_notifications: ^15.1.0+1
  cached_network_image: ^3.2.3
  image_picker: ^1.0.2
  
  # State Management
  provider: ^6.0.5
  
  # Utils
  intl: ^0.18.1
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

flutter:
  uses-material-design: true
  
